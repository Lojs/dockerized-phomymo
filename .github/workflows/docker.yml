name: Build and Publish Docker Image

on:
  push:
    branches:
      - master
      - dev
    paths:
      - "src/web/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docker.yml"

  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.ref_name == 'master' && 'latest' || 'dev' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Apply landscape rotation fix on dev
        if: github.ref_name == 'dev'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/web/canvas.js')
          s = p.read_text()
          if '_rotatePixels90CW' not in s:
              print('Landscape rotation fix already applied.')
          else:
              s = s.replace('_rotatePixels90CW', '_rotatePixels90CCW')
              s = s.replace('Rotate RGBA pixel data 90 degrees clockwise', 'Rotate RGBA pixel data 90 degrees counter-clockwise')
              s = s.replace('const dstX = height - 1 - y;\n      const dstY = x;', 'const dstX = y;\n      const dstY = width - 1 - x;')
              p.write_text(s)
              print('Landscape rotation fix applied.')
          PY

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Commit landscape rotation fix and remove temporary automation
        if: github.ref_name == 'dev'
        shell: bash
        run: |
          if git diff --quiet -- src/web/canvas.js; then
            echo 'No source change to commit.'
            exit 0
          fi
          rm -f .github/workflows/fix-landscape-rotation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/web/canvas.js .github/workflows/fix-landscape-rotation.yml
          git commit -m 'fix landscape raster rotation'
          git push