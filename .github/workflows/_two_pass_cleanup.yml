name: Two-pass cleanup check

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean remaining landscape override
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/web/app.js')
          text = path.read_text()
          pattern = re.compile(r"const rasterAlignment =\s*state\.orientation === 'landscape' \? 'left' : printerAlignment;")
          text, count = pattern.subn('const rasterAlignment = printerAlignment;', text)
          if count == 0:
              raise SystemExit('No remaining temporary landscape alignment override found')
          path.write_text(text)
          print(f'Cleaned {count} remaining override(s)')
          PY

      - name: Syntax check
        run: |
          cp src/web/app.js /tmp/app.mjs
          cp src/web/canvas.js /tmp/canvas.mjs
          cp src/web/printer.js /tmp/printer.mjs
          node --check /tmp/app.mjs
          node --check /tmp/canvas.mjs
          node --check /tmp/printer.mjs

      - name: Commit cleanup and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/_two_pass_cleanup.yml
          git add src/web/app.js .github/workflows/_two_pass_cleanup.yml
          git commit -m "Remove temporary landscape alignment override [skip ci]"
          git push origin HEAD:dev

  review:
    needs: repair
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repaired dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 1

      - name: Independent review
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          canvas = Path('src/web/canvas.js').read_text()
          app = Path('src/web/app.js').read_text()
          dockerfile = Path('Dockerfile').read_text()
          printers = json.loads(Path('src/web/printers.json').read_text())

          assert 'sed -i' not in dockerfile
          assert 'function transformElementsForOrientation(' in app
          assert "state.orientation === 'landscape' ? 'left' : printerAlignment" not in app
          assert app.count('const rasterAlignment = printerAlignment;') == 3
          assert 'const outputWidthBytes = rotateForPrint ? Math.ceil(width / 8) : printerWidthBytes;' in canvas
          assert 'rotateForPrint' in canvas

          batch_start = app.index('async function handleBatchPrint() {')
          batch_end = app.index('\n}\n\n/**\n * Print single label from preview', batch_start)
          batch = app[batch_start:batch_end]
          assert 'const printerDpi = getPrinterDpi(deviceName, printerModel);' in batch
          assert 'getRasterDataRaw(mergedElements, ditherMode)' in batch
          assert 'mergedElements,' in batch
          assert 'elementsToRender' not in batch

          m221 = next(p for p in printers['printers'] if p['id'] == 'm221')
          assert m221['widthBytes'] == 72
          assert m221['rotated'] is False

          for name in ('app.js', 'canvas.js', 'printer.js'):
              src = Path('src/web') / name
              dst = Path('/tmp') / name.replace('.js', '.mjs')
              dst.write_text(src.read_text())
              subprocess.run(['node', '--check', str(dst)], check=True)

          print('SECOND PASS: OK')
          PY
