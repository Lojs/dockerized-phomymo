name: Apply landscape raster fix

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch raster width for landscape
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/web/canvas.js')
          text = path.read_text()

          start_marker = "  getRasterData(elements, printerWidthBytes = DEFAULT_PRINTER_WIDTH_BYTES, printerDpi = 203, ditherMode = 'auto', alignment = 'center', rotateForPrint = false) {"
          end_marker = "  /**\n   * Get canvas image data as raw raster (no padding/centering)"

          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate getRasterData block')

          new_block = '''  getRasterData(elements, printerWidthBytes = DEFAULT_PRINTER_WIDTH_BYTES, printerDpi = 203, ditherMode = 'auto', alignment = 'center', rotateForPrint = false) {
    let { pixels, width, height } = this._renderToPixels(elements);

    // Rotate landscape design back to the physical paper orientation before printing
    if (rotateForPrint) {
      const rotated = this._rotatePixels90CW(pixels, width, height);
      pixels = rotated.pixels;
      width = rotated.width;
      height = rotated.height;
    }

    // Scale up for higher DPI printers (e.g., M02 Pro at 300 DPI)
    if (printerDpi > 203) {
      const scale = printerDpi / 203;
      const scaledWidth = Math.round(width * scale);
      const scaledHeight = Math.round(height * scale);

      // Create scaled canvas
      const scaledCanvas = document.createElement('canvas');
      scaledCanvas.width = scaledWidth;
      scaledCanvas.height = scaledHeight;
      const scaledCtx = scaledCanvas.getContext('2d');

      // Create source canvas from pixels
      const srcCanvas = document.createElement('canvas');
      srcCanvas.width = width;
      srcCanvas.height = height;
      const srcCtx = srcCanvas.getContext('2d');
      const srcImageData = srcCtx.createImageData(width, height);
      srcImageData.data.set(pixels);
      srcCtx.putImageData(srcImageData, 0, 0);

      // Scale up with smooth interpolation
      scaledCtx.imageSmoothingEnabled = true;
      scaledCtx.imageSmoothingQuality = 'high';
      scaledCtx.drawImage(srcCanvas, 0, 0, scaledWidth, scaledHeight);

      // Get scaled pixels
      const scaledImageData = scaledCtx.getImageData(0, 0, scaledWidth, scaledHeight);
      pixels = scaledImageData.data;
      width = scaledWidth;
      height = scaledHeight;

      // Landscape output already matches the physical paper width after rotation.
      // Do not pad it to the printer's maximum head width, which can turn padding
      // into a visible blank section on printers whose raster/feed axes differ.
      const outputWidthBytes = rotateForPrint
        ? Math.ceil(scaledWidth / 8)
        : printerWidthBytes;

      const data = this._pixelsToRaster(pixels, width, height, outputWidthBytes, 'left', ditherMode);

      return {
        data,
        widthBytes: outputWidthBytes,
        heightLines: height,
      };
    }

    // For landscape printing, use the actual rotated design width rather than
    // the printer's maximum width. Portrait printing keeps the existing alignment
    // and full-head-width behavior.
    const outputWidthBytes = rotateForPrint
      ? Math.ceil(width / 8)
      : printerWidthBytes;

    const data = this._pixelsToRaster(
      pixels,
      width,
      height,
      outputWidthBytes,
      alignment,
      ditherMode
    );

    return {
      data,
      widthBytes: outputWidthBytes,
      heightLines: height,
    };
  }

'''

          text = text[:start] + new_block + text[end:]
          path.write_text(text)

          # Verify the intended logic is present exactly once.
          updated = path.read_text()
          if updated.count("Math.ceil(width / 8)") < 1:
              raise SystemExit('Landscape raster-width logic was not applied')

      - name: Verify syntax
        run: node --check src/web/canvas.js

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/_apply-landscape-raster-fix.yml
          git add src/web/canvas.js .github/workflows/_apply-landscape-raster-fix.yml
          git commit -m "Fix landscape raster width without changing printer capability [skip ci]"
          git push origin HEAD:dev
