name: Apply Landscape Rotation Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply rotation fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/web/canvas.js')
          s = p.read_text()
          old = '''_rotatePixels90CW(pixels, width, height)'''
          new = '''_rotatePixels90CCW(pixels, width, height)'''
          if old not in s:
              raise SystemExit('rotation function not found')
          s = s.replace(old, new)
          s = s.replace('90 degrees clockwise', '90 degrees counter-clockwise')
          s = s.replace('90° clockwise: (x, y) -> (height - 1 - y, x)', '90° counter-clockwise: (x, y) -> (y, width - 1 - x)')
          s = s.replace('const dstX = height - 1 - y;\n        const dstY = x;', 'const dstX = y;\n        const dstY = width - 1 - x;')
          p.write_text(s)
          PY

      - name: Verify and commit
        shell: bash
        run: |
          grep -n -A28 -B2 '_rotatePixels90CCW' src/web/canvas.js
          git diff --check
          git diff -- src/web/canvas.js
          rm .github/workflows/fix-landscape-rotation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/web/canvas.js .github/workflows/fix-landscape-rotation.yml
          git commit -m 'fix landscape raster rotation'
          git push