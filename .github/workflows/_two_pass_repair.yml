name: Two-pass orientation repair

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply clean source fix
        shell: python
        run: |
          from pathlib import Path
          import re

          canvas = Path('src/web/canvas.js')
          text = canvas.read_text()

          pattern = re.compile(r"  getRasterData\(elements, printerWidthBytes = DEFAULT_PRINTER_WIDTH_BYTES, printerDpi = 203, ditherMode = 'auto', alignment = 'center', rotateForPrint = false\) \{.*?\n  \}\n\n  /\*\*\n   \* Get canvas image data as raw raster", re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('getRasterData block not found')

          new_block = '''  getRasterData(elements, printerWidthBytes = DEFAULT_PRINTER_WIDTH_BYTES, printerDpi = 203, ditherMode = 'auto', alignment = 'center', rotateForPrint = false) {
    let { pixels, width, height } = this._renderToPixels(elements);

    // Rotate landscape design back to the physical paper orientation before printing.
    if (rotateForPrint) {
      const rotated = this._rotatePixels90CW(pixels, width, height);
      pixels = rotated.pixels;
      width = rotated.width;
      height = rotated.height;
    }

    if (printerDpi > 203) {
      const scale = printerDpi / 203;
      const scaledWidth = Math.round(width * scale);
      const scaledHeight = Math.round(height * scale);

      const scaledCanvas = document.createElement('canvas');
      scaledCanvas.width = scaledWidth;
      scaledCanvas.height = scaledHeight;
      const scaledCtx = scaledCanvas.getContext('2d');

      const srcCanvas = document.createElement('canvas');
      srcCanvas.width = width;
      srcCanvas.height = height;
      const srcCtx = srcCanvas.getContext('2d');
      const srcImageData = srcCtx.createImageData(width, height);
      srcImageData.data.set(pixels);
      srcCtx.putImageData(srcImageData, 0, 0);

      scaledCtx.imageSmoothingEnabled = true;
      scaledCtx.imageSmoothingQuality = 'high';
      scaledCtx.drawImage(srcCanvas, 0, 0, scaledWidth, scaledHeight);

      const scaledImageData = scaledCtx.getImageData(0, 0, scaledWidth, scaledHeight);
      pixels = scaledImageData.data;
      width = scaledWidth;
      height = scaledHeight;

      const outputWidthBytes = rotateForPrint
        ? Math.ceil(width / 8)
        : printerWidthBytes;

      const data = this._pixelsToRaster(
        pixels,
        width,
        height,
        outputWidthBytes,
        rotateForPrint ? 'left' : alignment,
        ditherMode
      );

      return {
        data,
        widthBytes: outputWidthBytes,
        heightLines: height,
      };
    }

    // Landscape output matches the physical paper width after rotation, so do not
    // pad it to the printer's maximum head width. Portrait keeps existing behavior.
    const outputWidthBytes = rotateForPrint
      ? Math.ceil(width / 8)
      : printerWidthBytes;

    const data = this._pixelsToRaster(
      pixels,
      width,
      height,
      outputWidthBytes,
      rotateForPrint ? 'left' : alignment,
      ditherMode
    );

    return {
      data,
      widthBytes: outputWidthBytes,
      heightLines: height,
    };
  }

  /**
   * Get canvas image data as raw raster'''

          text = text[:match.start()] + new_block + text[match.end():]
          canvas.write_text(text)

          app = Path('src/web/app.js')
          app_text = app.read_text()
          old = "const rasterAlignment =\n      state.orientation === 'landscape' ? 'left' : printerAlignment;"
          app_text = app_text.replace(old, "const rasterAlignment = printerAlignment;")
          app.write_text(app_text)

          dockerfile = Path('Dockerfile')
          dockerfile.write_text('''FROM nginx:alpine\n\nLABEL org.opencontainers.image.title="Phomomo"\nLABEL org.opencontainers.image.description="Browser-based label designer for Phomemo printers"\nLABEL org.opencontainers.image.source="https://github.com/transcriptionstream/phomymo"\n\nRUN rm -rf /usr/share/nginx/html/*\n\nCOPY src/web/ /usr/share/nginx/html/\n\nEXPOSE 80\n'''.replace('Phomomo','Phomymo'))

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/_two_pass_repair.yml
          git add src/web/canvas.js src/web/app.js Dockerfile .github/workflows/_two_pass_repair.yml
          git commit -m "Clean up landscape raster handling [skip ci]"
          git push origin HEAD:dev

  review:
    needs: repair
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repaired dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 1

      - name: Review source invariants
        shell: python
        run: |
          from pathlib import Path
          import json
          import re
          import subprocess

          dockerfile = Path('Dockerfile').read_text()
          canvas = Path('src/web/canvas.js').read_text()
          app = Path('src/web/app.js').read_text()
          printers = json.loads(Path('src/web/printers.json').read_text())

          assert 'sed -i' not in dockerfile, 'Dockerfile still contains runtime source patch hack'
          assert 'Math.ceil(width / 8)' in canvas, 'Landscape raster width calculation missing'
          assert 'rotateForPrint' in canvas, 'Landscape rotation path missing'
          assert "state.orientation === 'landscape' ? 'left' : printerAlignment" not in app, 'Old special landscape alignment remains'

          m221 = next(p for p in printers['printers'] if p['id'] == 'm221')
          assert m221['widthBytes'] == 72, f"M221 capability changed: {m221['widthBytes']}"

          subprocess.run(['node', '--check', 'src/web/canvas.js'], check=True)
          subprocess.run(['node', '--check', 'src/web/app.js'], check=True)
          subprocess.run(['node', '--check', 'src/web/printer.js'], check=True)

          print('Two-pass review passed')
