name: Sync Upstream

on:
  schedule:
    - cron: "17 3 * * 0"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync upstream branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update upstream branch
        run: |
          git remote add upstream https://github.com/transcriptionstream/phomymo.git
          git fetch upstream master

          git checkout -B upstream upstream/master
          git push origin upstream --force
